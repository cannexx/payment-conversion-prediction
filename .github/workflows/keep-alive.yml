# 보조 슬립 방지 수단. 2026-09-07부터 cron-job.org(외부 무료 크론 서비스)를
# 10분 간격 메인 핑으로 병행 운영 중 — GitHub scheduled workflow는 저장소 활동이
# 적으면 실행이 지연/스킵될 수 있어 이 워크플로우만으로는 신뢰하기 어려움.
name: Keep Streamlit App Alive

on:
  schedule:
    # 매 10분마다 실행 (UTC 기준)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          # Streamlit 프론트도어가 앱 요청 전에 쿠키 기반 리다이렉트(303)를
          # 몇 차례 거치므로, 쿠키 저장(-c/-b) 없이 -L만 쓰면 리다이렉트 루프에
          # 빠져 항상 303으로 끝난다. 쿠키를 유지해야 최종적으로 200을 받는다.
          status=$(curl -s -L -c /tmp/cookies.txt -b /tmp/cookies.txt \
            -o /dev/null -w "%{http_code}" --max-time 30 \
            https://payment-conversion-prediction-kfmzlsbdapywsfresbxfkm.streamlit.app/)
          echo "Final status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive ping failed with status $status"
            exit 1
          fi
