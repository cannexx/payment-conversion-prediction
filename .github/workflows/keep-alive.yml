# curl 기반 핑은 Streamlit이 돌려주는 정적 HTML 셸만 받을 뿐 실제 Python
# 앱(WebSocket 세션)을 띄우지 않아 슬립 방지 효과가 없음이 확인됨(2026-09-11).
# 이후 Playwright 헤드리스 브라우저로 실제 페이지를 렌더링해 방문하고,
# 슬립 화면이 뜨면 "Yes, get this app back up!" 버튼까지 클릭하는 방식으로 전환.
# cron-job.org는 검증 기간 동안 보조 수단으로 유지 중.
name: Keep Streamlit App Alive

on:
  schedule:
    # 매 10분마다 실행 (UTC 기준)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Actions 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app with headless browser (wakes it if asleep)
        run: python .github/scripts/keep_alive_visit.py
